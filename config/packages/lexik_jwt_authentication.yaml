lexik_jwt_authentication:
    secret_key: '%env(resolve:JWT_SECRET_KEY)%'
    public_key: '%env(resolve:JWT_PUBLIC_KEY)%'
    pass_phrase: '%env(JWT_PASSPHRASE)%'
    token_ttl: 120
    token_extractors:
        # API clients and tests.
        authorization_header:
            enabled: true
            prefix: Bearer
            name: Authorization
        # Browser (Twig) requests, set by App\Security\JwtLoginAuthenticator.
        cookie:
            enabled: true
            name: '%app.jwt_cookie_name%'
