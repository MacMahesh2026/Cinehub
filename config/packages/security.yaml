security:
    # https://symfony.com/doc/current/security.html#registering-the-user-hashing-passwords
    password_hashers:
        Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface: 'auto'

    # https://symfony.com/doc/current/security.html#loading-the-user-the-user-provider
    providers:
        app_user_provider:
            entity:
                class: App\Entity\User
                property: email

    firewalls:
        dev:
            # Ensure dev tools and static assets are always allowed
            pattern: ^/(_profiler|_wdt|assets|build)/
            security: false

        # JSON login for API clients: POST /api/login_check {email, password}
        # Returns { "token": "..." } and never creates a session.
        api_login:
            pattern: ^/api/login_check$
            stateless: true
            provider: app_user_provider
            json_login:
                check_path: api_login_check
                username_path: email
                password_path: password
                success_handler: lexik_jwt_authentication.handler.authentication_success
                failure_handler: lexik_jwt_authentication.handler.authentication_failure

        # Twig login form: authenticates and stores the JWT in a cookie.
        # This firewall has no jwt authenticator on purpose, so a stale cookie
        # cannot block the user from reaching the login form.
        web_login:
            pattern: ^/login$
            stateless: true
            provider: app_user_provider
            custom_authenticators:
                - App\Security\JwtLoginAuthenticator

        # Logout only clears the JWT cookie, so it must not require a token.
        web_logout:
            pattern: ^/logout$
            security: false

        # Admin back office: a normal session-based form login, separate from
        # the stateless JWT used by the public site.
        admin:
            pattern: ^/admin
            provider: app_user_provider
            form_login:
                login_path: admin_login
                check_path: admin_login
                default_target_path: admin
                enable_csrf: true
            logout:
                path: admin_logout
                target: admin_login
            login_throttling:
                max_attempts: 5
                interval: '1 minute'

        # Everything else is authenticated from the JWT (cookie or Bearer header).
        main:
            pattern: ^/
            stateless: true
            provider: app_user_provider
            jwt: ~
            entry_point: App\Security\AuthenticationEntryPoint

    # Note: Only the *first* matching rule is applied
    access_control:
        - { path: ^/admin/login, roles: PUBLIC_ACCESS }
        - { path: ^/admin, roles: ROLE_ADMIN }
        - { path: ^/api/login_check, roles: PUBLIC_ACCESS, methods: [POST] }
        - { path: ^/api/register, roles: PUBLIC_ACCESS, methods: [POST] }
        - { path: ^/api, roles: ROLE_USER }
        - { path: ^/my-bookings, roles: ROLE_USER }
        - { path: ^/showtime/\d+/book, roles: ROLE_USER }
        - { path: ^/booking, roles: ROLE_USER }

when@test:
    security:
        password_hashers:
            # Password hashers are resource-intensive by design to ensure security.
            # In tests, it's safe to reduce their cost to improve performance.
            Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface:
                algorithm: auto
                cost: 4 # Lowest possible value for bcrypt
                time_cost: 3 # Lowest possible value for argon
                memory_cost: 10 # Lowest possible value for argon
