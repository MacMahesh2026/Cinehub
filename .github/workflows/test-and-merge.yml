name: Test and Merge to Master

on:
  push:
    branches:
      - dev

jobs:
  test:
    name: Run Symfony Test Suite
    runs-on: ubuntu-24.04 

    steps:
      - name: Checkout Code
        uses: actions/checkout@v5

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, xml, ctype, iconv, intl, pdo_sqlite
          tools: phpunit # Installs global backup fallback version
          coverage: none

      - name: Check Composer Version
        run: composer --version

      - name: Get Composer Cache Directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

      - name: Cache Composer Dependencies
        uses: actions/cache@v5
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-composer-

      # Crucial: Fixes Symfony recipe issues by forcing dev dependencies to install completely
      - name: Install Dependencies
        run: composer install --prefer-dist --no-progress --no-interaction

      - name: Execute Symfony Tests
        run: |
          if [ -f "bin/phpunit" ]; then
            echo "Running via Symfony phpunit binary..."
            php bin/phpunit
          elif [ -f "vendor/bin/phpunit" ]; then
            echo "Running via Vendor phpunit binary..."
            vendor/bin/phpunit
          else
            echo "Running via Global Fallback phpunit binary..."
            phpunit
          fi
