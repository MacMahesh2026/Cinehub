name: Test, Merge, and Deploy Pipeline

on:
  push:
    branches:
      - dev

jobs:
  test:
    name: Run Symfony Test Suite
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Code
        uses: actions/checkout@v5

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, xml, ctype, iconv, intl, pdo_sqlite
          tools: phpunit
          coverage: none

      - name: Install Dependencies
        run: composer install --prefer-dist --no-progress --no-interaction

      - name: Execute Symfony Tests
        run: |
          if [ -f "bin/phpunit" ]; then
            php bin/phpunit
          elif [ -f "vendor/bin/phpunit" ]; then
            vendor/bin/phpunit
          else
            phpunit
          fi

  merge-to-master:
    name: Merge Dev to Master
    needs: test
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Merge dev into master
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@://github.com"
          git fetch origin master
          git checkout master
          git merge origin/dev --ff-only
          git push origin master

  deploy-to-aws:
    name: Production Deployment
    needs: merge-to-master
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Code
        uses: actions/checkout@v5

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Debug AWS deployment inputs
        env:
          AWS_INSTANCE_ID: ${{ secrets.AWS_INSTANCE_ID }}
          AWS_REGION: ${{ secrets.AWS_REGION }}
        run: |
          set -euxo pipefail
          echo "========== AWS DEBUG =========="
          echo "GITHUB_REF=${GITHUB_REF}"
          echo "GITHUB_SHA=${GITHUB_SHA}"
          echo "AWS_REGION=${AWS_REGION}"
          echo "AWS_INSTANCE_ID=${AWS_INSTANCE_ID}"
          aws sts get-caller-identity

      - name: Deploy to AWS EC2 via SSM
        env:
          AWS_INSTANCE_ID: ${{ secrets.AWS_INSTANCE_ID }}
          AWS_REGION: ${{ secrets.AWS_REGION }}
        run: |
          set -euxo pipefail

          echo "Starting deployment to AWS EC2 instance: ${AWS_INSTANCE_ID}"

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "${AWS_INSTANCE_ID}" \
            --document-name "AWS-RunShellScript" \
            --comment "Deploying master branch to production server - $(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --parameters '{
              "commands":[
                "set -euxo pipefail",
                "echo \"==> Who am I?\"",
                "whoami",
                "echo \"==> Check app folder\"",
                "ls -ld /var/www/cinehub || true",
                "echo \"==> Check repo status\"",
                "sudo -u ubuntu -H bash -lc \"cd /var/www/cinehub && git status --short --branch || true\"",
                "echo \"==> Pull latest code from master\"",
                "sudo -u ubuntu -H bash -lc \"cd /var/www/cinehub && git fetch origin master && git checkout master && git reset --hard origin/master && git clean -fd\"",
                "echo \"==> Install Composer dependencies\"",
                "sudo -u ubuntu -H bash -lc \"cd /var/www/cinehub && composer install --no-interaction --prefer-dist --no-progress\"",
                "echo \"==> Clear Symfony cache\"",
                "sudo -u ubuntu -H bash -lc \"cd /var/www/cinehub && php bin/console cache:clear --env=prod\"",
                "echo \"==> Run Doctrine migrations\"",
                "sudo -u ubuntu -H bash -lc \"cd /var/www/cinehub && php bin/console doctrine:migrations:migrate --no-interaction || true\"",
                "echo \"==> Restart web server\"",
                "sudo systemctl restart nginx || sudo systemctl restart apache2 || true",
                "echo \"==> Deployment finished successfully\""
              ]
            }' \
            --region "${AWS_REGION}" \
            --query 'Command.CommandId' \
            --output text)

          echo "SSM Command ID: ${COMMAND_ID}"

          STATUS="Pending"
          for i in $(seq 1 30); do
            STATUS=$(aws ssm get-command-invocation \
              --command-id "${COMMAND_ID}" \
              --instance-id "${AWS_INSTANCE_ID}" \
              --query 'Status' \
              --output text \
              --region "${AWS_REGION}" || true)

            echo "Current SSM status: ${STATUS}"

            if [ "${STATUS}" = "Success" ] || [ "${STATUS}" = "Failed" ] || [ "${STATUS}" = "Cancelled" ] || [ "${STATUS}" = "TimedOut" ]; then
              break
            fi

            sleep 10
          done

          echo "Final SSM status: ${STATUS}"

          echo "========== Standard Output =========="
          aws ssm get-command-invocation \
            --command-id "${COMMAND_ID}" \
            --instance-id "${AWS_INSTANCE_ID}" \
            --query 'StandardOutputContent' \
            --output text \
            --region "${AWS_REGION}" || true

          echo "========== Standard Error =========="
          aws ssm get-command-invocation \
            --command-id "${COMMAND_ID}" \
            --instance-id "${AWS_INSTANCE_ID}" \
            --query 'StandardErrorContent' \
            --output text \
            --region "${AWS_REGION}" || true

          if [ "${STATUS}" != "Success" ]; then
            echo "AWS deployment failed."
            exit 1
          fi