name: Test, Merge, and Deploy Pipeline

on:
  push:
    branches:
      - dev

env:
  APP_SECRET: ${{ secrets.APP_SECRET }}
  DATABASE_URL: ${{ secrets.DATABASE_URL }}
  JWT_PASSPHRASE: ${{ secrets.JWT_PASSPHRASE }}

jobs:
  test:
    name: Run Symfony Test Suite
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Code
        uses: actions/checkout@v5

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, xml, ctype, iconv, intl, pdo_sqlite
          tools: phpunit
          coverage: none

      - name: Install Dependencies
        run: composer install --prefer-dist --no-progress --no-interaction

      - name: Create .env for CI
        run: |
          cp .env.example .env
          mkdir -p config/jwt
          openssl genrsa -out config/jwt/private.pem 2048
          openssl rsa -in config/jwt/private.pem -pubout -out config/jwt/public.pem

      - name: Execute Symfony Tests
        run: |
          if [ -f "bin/phpunit" ]; then
            php bin/phpunit
          elif [ -f "vendor/bin/phpunit" ]; then
            vendor/bin/phpunit
          else
            phpunit
          fi

  merge-to-master:
    name: Merge Dev to Master
    needs: test
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Merge dev into master
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@://github.com"
          git fetch origin master
          git checkout master
          git merge origin/dev --ff-only
          git push origin master

  deploy-to-aws:
    name: Production Deployment
    needs: merge-to-master
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Code
        uses: actions/checkout@v5

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Create production env for deploy
        run: |
          cp .env.example .env
          mkdir -p config/jwt
          openssl genrsa -out config/jwt/private.pem 2048
          openssl rsa -in config/jwt/private.pem -pubout -out config/jwt/public.pem

      - name: Execute Symfony Deployment via AWS CLI SSM
        run: |
          aws ssm send-command \
            --instance-ids "${{ secrets.AWS_INSTANCE_ID }}" \
            --document-name "AWS-RunShellScript" \
            --comment "Deploying master branch to production server" \
            --parameters '{"commands":["set -euxo pipefail","echo \"==> Pull latest code from master\"","sudo -u ubuntu -H bash -lc \"cd /var/www/cinehub && git fetch origin master && git checkout master && git reset --hard origin/master && git clean -fd\"","echo \"==> Install Composer dependencies\"","sudo -u ubuntu -H bash -lc \"cd /var/www/cinehub && composer install --no-interaction --prefer-dist --no-progress\"","echo \"==> Clear Symfony cache\"","sudo -u ubuntu -H bash -lc \"cd /var/www/cinehub && php bin/console cache:clear --env=prod\"","echo \"==> Run Doctrine migrations\"","sudo -u ubuntu -H bash -lc \"cd /var/www/cinehub && php bin/console doctrine:migrations:migrate --no-interaction || true\"","echo \"==> Restart web server\"","sudo systemctl restart nginx || sudo systemctl restart apache2 || true","echo \"==> Deployment finished successfully\""]}' \
            --region "${{ secrets.AWS_REGION }}"