name: Test, Merge, and Deploy Pipeline

on:
  push:
    branches:
      - dev

jobs:
  test:
    name: Run Symfony Test Suite
    runs-on: ubuntu-24.04 
    steps:
      - name: Checkout Code
        uses: actions/checkout@v5

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, xml, ctype, iconv, intl, pdo_sqlite
          tools: phpunit
          coverage: none

      - name: Install Dependencies
        run: composer install --prefer-dist --no-progress --no-interaction

      - name: Execute Symfony Tests
        run: |
          if [ -f "bin/phpunit" ]; then
            php bin/phpunit
          elif [ -f "vendor/bin/phpunit" ]; then
            vendor/bin/phpunit
          else
            phpunit
          fi

  merge-to-master:
    name: Merge Dev to Master
    needs: test # Waits for tests to pass successfully
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Merge dev into master
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@://github.com"
          git fetch origin master
          git checkout master
          git merge origin/dev --ff-only
          git push origin master

  deploy-to-aws:
    name: Production Deployment
    needs: merge-to-master
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v5

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      # FIX: Replaced the deleted third-party action with the official AWS CLI native tool
      - name: Execute Symfony Deployment via AWS CLI SSM
        run: |
          aws ssm send-command \
            --instance-ids "${{ secrets.AWS_INSTANCE_ID }}" \
            --document-name "AWS-RunShellScript" \
            --comment "Deploying master branch to production server" \
            --parameters '{"commands":[
              "sudo -u ubuntu -H sh -c \"cd /var/www/your-symfony-project && git fetch origin master && git reset --hard origin/master && composer install --no-dev --optimize-autoloader --no-interaction && php bin/console cache:clear --env=prod && php bin/console cache:warmup --env=prod\""
            ]}' \
            --region "${{ secrets.AWS_REGION }}"
