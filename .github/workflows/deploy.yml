name: Deploy to Production

on:
  push:
    branches:
      - master

jobs:
  deploy:
    name: AWS Symfony Production Deployment
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Execute Symfony Deployment via AWS SSM
        uses: peterkimzz/aws-ssm-run-command@v2.0.0
        with:
          aws-region: ${{ secrets.AWS_REGION }}
          instance-ids: ${{ secrets.AWS_INSTANCE_ID }}
          working-directory: /var/www/your-symfony-project # Replace with your actual server path
          command: |
            # 1. Fetch the latest code from master branch
            git fetch origin master
            git reset --hard origin/master

            # 2. Install production dependencies (ignores dev packages like phpunit)
            composer install --no-dev --optimize-autoloader --no-interaction

            # 3. Clear and warm up the Symfony production cache
            php bin/console cache:clear --env=prod
            php bin/console cache:warmup --env=prod

            # 4. Run database migrations (optional, uncomment if using Doctrine)
            # php bin/console doctrine:migrations:migrate --no-interaction --env=prod

            # 5. Fix permissions so the web server (Nginx/Apache) can read the new cache files
            # sudo chown -R www-data:www-data var/
